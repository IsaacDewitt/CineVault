<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieUI</title>
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
        </svg>
        <span>MovieUI</span>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
          <span>电影</span>
          <span class="badge" id="count-all">0</span>
        </a>
        <a href="#" class="nav-item" data-view="favorites">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <span>收藏夹</span>
          <span class="badge" id="count-fav">0</span>
        </a>
        <a href="#" class="nav-item" data-view="series">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
          <span>剧集</span>
          <span class="badge" id="count-series">0</span>
        </a>
        <a href="#" class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          <span>播放历史</span>
        </a>

        <div class="nav-divider"></div>
        <div class="nav-section-title">标签</div>
        <div id="tag-list" class="tag-nav-list"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-icon" id="btn-scan" title="扫描视频">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>扫描</span>
        </button>
        <button class="btn-icon" id="btn-refresh" title="刷新所有扫描位置（检查文件是否存在）">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>刷新</span>
        </button>
        <button class="btn-icon" id="btn-export" title="导出数据">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <span>导出</span>
        </button>
        <button class="btn-icon" id="btn-import" title="导入数据">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          <span>导入</span>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶栏 -->
      <header class="topbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="搜索视频..." />
        </div>

        <div class="topbar-actions">
          <select id="sort-select" class="select-input">
            <option value="updated">最近更新</option>
            <option value="name">按名称</option>
            <option value="size">按大小</option>
            <option value="rating">按评分</option>
          </select>

          <select id="rating-filter" class="select-input">
            <option value="0">全部评分</option>
            <option value="8">8分以上</option>
            <option value="6">6分以上</option>
            <option value="4">4分以上</option>
          </select>

          <div class="view-toggle">
            <button class="btn-view active" id="btn-grid" title="网格视图">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
            </button>
            <button class="btn-view" id="btn-list" title="列表视图">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- 统计信息条 -->
      <div class="stats-bar" id="stats-bar">
        <span id="stat-total">0 部电影</span>
        <span id="stat-series" class="hidden">0 个剧集</span>
        <span id="stat-size">总大小 0 GB</span>
      </div>

      <!-- 剧集面包屑导航 -->
      <div id="series-breadcrumb" class="series-breadcrumb hidden">
        <button class="breadcrumb-back" id="btn-back-series-overview" title="返回剧集列表">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="breadcrumb-path">
          <span class="breadcrumb-parent" id="breadcrumb-parent">剧集</span>
          <svg class="breadcrumb-sep" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          <span class="breadcrumb-current" id="breadcrumb-series-name"></span>
        </div>
        <span class="breadcrumb-count" id="breadcrumb-episode-count"></span>
      </div>

      <!-- 视频列表容器 -->
      <div id="video-container" class="video-grid"></div>

      <!-- 空状态 -->
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor" opacity="0.3">
          <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
        </svg>
        <h3>还没有视频</h3>
        <p>点击左侧"扫描"按钮开始扫描你的视频文件</p>
      </div>
    </main>
  </div>

  <!-- 扫描对话框 -->
  <div id="scan-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>扫描视频文件</h2>
        <button class="btn-close" id="scan-close">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
          <input type="text" id="scan-path" placeholder="选择要扫描的文件夹" readonly style="flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:14px;" />
          <button class="btn btn-secondary" id="btn-browse-scan">浏览</button>
        </div>
        <div class="scan-options">
          <label class="checkbox-label">
            <input type="checkbox" id="incremental-scan" checked />
            <span>增量扫描（跳过已存在的文件）</span>
          </label>
          <label class="checkbox-label" style="margin-top:8px;">
            <input type="checkbox" id="scan-as-series" />
            <span>扫描为剧集（文件夹名作为剧集名）</span>
          </label>
          <label class="checkbox-label" style="margin-top:8px;">
            <input type="checkbox" id="scan-default-watched" />
            <span>默认已看过（新扫描的视频标记为已看过）</span>
          </label>
        </div>
        <div class="scan-progress hidden" id="scan-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p id="scan-status">扫描中...</p>
        </div>
        <div class="scan-result hidden" id="scan-result"></div>
        <div class="scan-folders-section" id="scan-folders-section" style="margin-top:16px;">
          <h3 style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">已扫描文件夹</h3>
          <div id="scan-folders-list" style="max-height:200px;overflow-y:auto;"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-scan">取消</button>
        <button class="btn btn-primary" id="btn-start-scan">开始扫描</button>
      </div>
    </div>
  </div>

  <!-- 标签管理对话框 -->
  <div id="tag-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>管理标签</h2>
        <button class="btn-close" id="tag-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tag-create">
          <input type="text" id="new-tag-name" placeholder="标签名称" />
          <input type="color" id="new-tag-color" value="#6366f1" />
          <button class="btn btn-primary" id="btn-add-tag">添加</button>
        </div>
        <div id="tag-manage-list" class="tag-manage-list"></div>
      </div>
    </div>
  </div>

  <!-- 视频详情对话框 -->
  <div id="video-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="video-detail-title">视频详情</h2>
        <button class="btn-close" id="video-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="video-detail">
          <div class="video-detail-info">
            <div class="detail-row">
              <label>标题：</label>
              <div style="flex:1;display:flex;gap:8px;align-items:center;">
                <input type="text" id="detail-title-input" style="flex:1;padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:14px;font-family:var(--font);" />
                <button class="btn btn-primary" id="btn-rename" style="padding:6px 14px;font-size:13px;">改名</button>
              </div>
            </div>
            <div class="detail-row">
              <label>文件路径：</label>
              <span id="detail-path"></span>
            </div>
            <div class="detail-row">
              <label>文件大小：</label>
              <span id="detail-size"></span>
            </div>
            <div class="detail-row">
              <label>评分：</label>
              <div class="rating-input" id="detail-rating"></div>
            </div>
            <div class="detail-row">
              <label>标签：</label>
              <div id="detail-tags" class="tag-container"></div>
            </div>
            <div class="detail-row">
              <label>操作：</label>
              <div class="action-buttons">
                <button class="btn btn-primary" id="btn-play">播放</button>
                <button class="btn btn-secondary" id="btn-open-folder">打开文件夹</button>
                <button class="btn btn-warning" id="btn-fav-toggle">收藏</button>
                <button class="btn" id="btn-watched-toggle" style="background:#10b981;color:white;">已看过</button>
                <button class="btn btn-secondary hidden" id="btn-back-series">返回剧集</button>
                <button class="btn btn-secondary hidden" id="btn-mark-series-watched">全剧已看过</button>
                <button class="btn btn-danger" id="btn-delete-video">删除记录</button>
                <button class="btn btn-danger" id="btn-delete-file" style="background:#991b1b;">删除文件</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 视频右键菜单 -->
  <div id="context-menu" style="display:none;position:fixed;z-index:9999;background:#1e1e3a;border:1px solid #2d2d4a;border-radius:8px;padding:4px;min-width:160px;box-shadow:0 4px 24px rgba(0,0,0,0.5);">
    <div class="ctx-item" data-action="play" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">▶ 播放</div>
    <div class="ctx-item" data-action="rename" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">✏ 改名</div>
    <div class="ctx-item" data-action="tag" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">🏷 添加标签</div>
    <div class="ctx-item" data-action="fav" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">★ 收藏/取消</div>
    <div class="ctx-item" data-action="watched" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">👁 切换已看过</div>
    <div class="ctx-item" data-action="folder" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">📁 打开文件夹</div>
    <div style="height:1px;background:#2d2d4a;margin:4px 0;"></div>
    <div class="ctx-item" data-action="delete" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#ef4444;">🗑 删除</div>
  </div>

  <!-- 标签右键菜单 -->
  <div id="tag-context-menu" style="display:none;position:fixed;z-index:9999;background:#1e1e3a;border:1px solid #2d2d4a;border-radius:8px;padding:4px;min-width:160px;box-shadow:0 4px 24px rgba(0,0,0,0.5);">
    <div class="tag-ctx-item" data-action="new-tag" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">➕ 新建标签</div>
    <div class="tag-ctx-item tag-ctx-need-target" data-action="filter" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">🔍 筛选此标签</div>
    <div class="tag-ctx-item tag-ctx-need-target" data-action="rename-tag" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">✏ 重命名</div>
    <div class="tag-ctx-item tag-ctx-need-target" data-action="change-color" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#e8e8e8;">🎨 改颜色</div>
    <div style="height:1px;background:#2d2d4a;margin:4px 0;"></div>
    <div class="tag-ctx-item tag-ctx-need-target" data-action="delete-tag" style="padding:8px 14px;cursor:pointer;border-radius:4px;font-size:13px;color:#ef4444;">🗑 删除标签</div>
  </div>

  <!-- 自定义确认对话框 -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content" style="width:400px;">
      <div class="modal-header">
        <h2 id="confirm-title">确认</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message" style="color:var(--text-secondary);line-height:1.6;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
